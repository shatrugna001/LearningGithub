<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors | MySite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>MySite</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Hello, world!</h2>
    <p>This is a minimal website built with HTML, CSS, and JavaScript.</p>
    <button id="btn">Click me</button>
    <p id="message"></p>
    <div id="emojis" aria-label="Smiley emojis added by clicking"></div>

    <section class="game-card" aria-labelledby="game-title">
      <h2 id="game-title">Rock Paper Scissors</h2>
      <p>Choose your move and see if you can beat the computer.</p>
      <div class="choices" role="group" aria-label="Choose rock, paper, or scissors">
        <button class="choice-button" type="button" data-choice="rock">✊ Rock</button>
        <button class="choice-button" type="button" data-choice="paper">✋ Paper</button>
        <button class="choice-button" type="button" data-choice="scissors">✌️ Scissors</button>
      </div>
      <p id="game-result" class="game-result" aria-live="polite">Make your first move!</p>
      <div class="scoreboard" aria-label="Score">
        <p>You <strong id="player-score">0</strong></p>
        <p>Computer <strong id="computer-score">0</strong></p>
        <p>Draws <strong id="draw-score">0</strong></p>
      </div>
      <button id="reset-game" class="reset-button" type="button">Reset score</button>
    </section>
  </main>

  <footer>&copy; 2026 MySite</footer>

  <script src="script.js"></script>
</body>
</html>
